<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 3D</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f0f2f5; }
        header { background: #1a2a6c; color: white; padding: 1.5rem; text-align: center; }
        .container { max-width: 900px; margin: 2rem auto; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .viewer-container { height: 500px; background: #eee; }
        model-viewer { width: 100%; height: 100%; }
        .info { padding: 1.5rem; }
    </style>
</head>
<body>
    <header><h1>Visualizador de Activos</h1></header>
    <div class="container">
        <div class="viewer-container">
            <model-viewer src="cocinae1.glb" auto-rotate camera-controls shadow-intensity="1"></model-viewer>
        </div>
        <div class="info">
            <h2>Modelo: cocinae1.glb</h2>
            <p>Usa el ratón para interactuar con el objeto 3D.</p>
        </div>
    </div>
</body>
</html>
